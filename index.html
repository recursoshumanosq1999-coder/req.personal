<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1080">
<title>Requisición de personal · MDreieck</title>
<meta name="description" content="Formulario de requisición de personal de MDreieck.">
<link rel="stylesheet" href="estilos.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<header class="hdr" id="hdr">
  <div class="hdr-row">
    <div class="logo" id="brandLogo">MD</div>
    <div class="htxt">
      <h1>Requisición de personal</h1>
      <div class="sub">MDreieck · Recursos Humanos</div>
    </div>
  </div>
  <div class="prog" id="prog"></div>
</header>

<main class="wrap" id="main"></main>

<nav class="navbar" id="navbar" hidden>
  <div class="nav-inner"><div class="nav-sec" id="nav"></div></div>
</nav>

<div class="sending" id="sendOv">
  <div class="send-box" id="sendBox">
    <div class="spin"></div>
    <div class="check-ic" id="checkIc">✓</div>
    <h3 id="sendTitle">Procesando…</h3>
    <p id="sendMsg">Un momento.</p>
    <button class="btn btn-ghost btn-block" id="sendClose" style="margin-top:14px;display:none" onclick="ocultarOv()">Entendido</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
<script>
const KEY_SOL = 'mdk_req_solicitante';
function datosSolicitante(){ try{ return JSON.parse(localStorage.getItem(KEY_SOL) || '{}'); }catch(e){ return {}; } }
function recordarSolicitante(d){
  const o = {}; todos().filter(c => c.recordar).forEach(c => { if(d[c.id]) o[c.id] = d[c.id]; });
  try{ localStorage.setItem(KEY_SOL, JSON.stringify(o)); }catch(e){}
}
function nueva(){ const b = nuevoBorrador(); Object.assign(b.d, datosSolicitante()); b.d.sexo = 'Indistinto'; b.firmas = {}; return b; }

let B = cargarBorrador();
if(!B || B.enviado) B = nueva();
const ULT = PASOS.length;          // pasos 1..5 ; 0 = bienvenida
let paso = 0;
let docFinal = null;

const $ = id => document.getElementById(id);
const main = $('main');

/* ---------- pantallas ---------- */
function progreso(){
  const p = $('prog');
  if(paso < 1 || paso > ULT){ p.innerHTML=''; p.hidden=true; $('hdr').classList.add('plain'); return; }
  p.hidden=false; $('hdr').classList.remove('plain');
  p.innerHTML = PASOS.map((s,i)=>{
    const n=i+1;
    return `<div class="pstep ${n===paso?'on':(n<paso?'done':'')}" ${n<paso?`onclick="ir(${n})"`:''}>
      <div class="pbar"></div><div class="plabel">${n}. ${s.nom}</div></div>`;
  }).join('');
}

function bienvenida(){
  const sigue = tieneDatos(B) && (B.paso||0) > 1;
  main.innerHTML = `
  <section class="card hero">
    <div class="hero-logo">${LOGO?`<img src="${LOGO}" alt="MDreieck">`:'<b>MDreieck</b>'}</div>
    <h2 class="hero-t">Requisición de personal</h2>
    <p class="hero-p">Solicita a Recursos Humanos el personal que necesitas para tu área.</p>
    <ul class="hero-l">
      <li><span>⏱️</span><div><b>Toma unos 5 minutos.</b> Son 5 pasos cortos y solo aparece lo que aplica a tu caso.</div></li>
      <li><span>🏗️</span><div><b>Si es por proyecto,</b> se te pedirán los datos del proyecto: cliente, fechas, ubicación y viáticos.</div></li>
      <li><span>📄</span><div><b>Al enviarla</b> recibe un folio, RH la recibe con su PDF y, si escribes tu correo, te llega una copia.</div></li>
      <li><span>💾</span><div>Lo que escribes se guarda en este equipo. Si cierras la página, puedes continuar después. Tus datos de solicitante se recuerdan para la siguiente vez.</div></li>
    </ul>
    <button class="btn btn-primary btn-block" onclick="ir(${sigue?Math.max(1,B.paso||1):1})">${sigue?'Continuar donde me quedé ›':'Comenzar ›'}</button>
    ${sigue?'<button class="link-test" onclick="reiniciar()">Empezar una nueva</button>':''}
  </section>`;
}

/* ---------- firmas ---------- */
function htmlPad(quien, titulo, nombreSug){
  const f=(B.firmas||{})[quien]||{};
  const nom=f.nombre!=null?f.nombre:(nombreSug||'');
  return `<div class="firma" data-quien="${quien}">
    <label class="q" for="fn_${quien}">${titulo} <b class="req">*</b></label>
    <input id="fn_${quien}" data-firma="${quien}" value="${esc(nom)}" placeholder="Nombre completo" autocomplete="off" maxlength="120">
    <div class="pad-wrap">
      <canvas class="pad" id="pad_${quien}" aria-label="Recuadro para dibujar la firma de ${esc(titulo)}"></canvas>
      <span class="pad-ph" id="ph_${quien}" ${f.img?'hidden':''}>Firma aquí con el dedo o el mouse</span>
      <span class="pad-linea" aria-hidden="true"></span>
    </div>
    <div class="pad-acc"><button type="button" class="link-test" onclick="borrarFirma('${quien}')">Borrar firma</button></div>
    <p class="ferr" id="ef_${quien}"></p>
  </div>`;
}
function htmlFirmas(){
  B.firmas=B.firmas||{};
  const ahora=B.dirAhora||'';
  return `<section class="card">
    <h2><span class="num ic">✍️</span>Firmas</h2>
    <p class="hint">Escribe el nombre completo y dibuja la firma. Aparecerán en el PDF.</p>
    ${htmlPad('sol','Firma del solicitante',B.d.solNombre)}
    <div class="field" style="margin-top:18px">
      <label class="q">¿El director(a) del área firma ahora? <b class="req">*</b></label>
      <div class="seg multi" role="radiogroup">
        ${['Sí, firma ahora','No, firmará después'].map(o=>`<button type="button" role="radio" data-dir="${o}" aria-checked="${ahora===o}" class="${ahora===o?'sel':''}">${o}</button>`).join('')}
      </div>
      <p class="ayuda">Si no está contigo, su espacio queda en blanco en el PDF para que firme después.</p>
      <p class="ferr" id="ef_dirAhora"></p>
    </div>
    <div id="padDir" ${ahora==='Sí, firma ahora'?'':'hidden'}>${htmlPad('dir','Firma del director(a) del área',B.d.director)}</div>
  </section>`;
}
const PADS={};
function montarPad(quien){
  const c=$('pad_'+quien); if(!c) return;
  const w=c.clientWidth, h=Math.round(w/3), dpr=window.devicePixelRatio||1;
  c.style.height=h+'px'; c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#14104a'; x.lineWidth=2.4;
  const f=(B.firmas||{})[quien];
  if(f&&f.img){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,w,h); im.src=f.img; }
  let dibujando=false, ult=null, trazo=false;
  const pt=e=>{ const r=c.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };
  c.onpointerdown=e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); dibujando=true; ult=pt(e);
    x.beginPath(); x.arc(ult.x,ult.y,1.1,0,Math.PI*2); x.fillStyle='#14104a'; x.fill(); trazo=true; $('ph_'+quien).hidden=true; };
  c.onpointermove=e=>{ if(!dibujando) return; const p=pt(e); x.beginPath(); x.moveTo(ult.x,ult.y); x.lineTo(p.x,p.y); x.stroke(); ult=p; };
  c.onpointerup=c.onpointercancel=()=>{ if(!dibujando) return; dibujando=false; if(trazo) guardarFirma(quien); };
  PADS[quien]={ c, w, h };
}
function guardarFirma(quien){
  const p=PADS[quien]; if(!p) return;
  const o=document.createElement('canvas'); o.width=900; o.height=300;
  o.getContext('2d').drawImage(p.c,0,0,900,300);
  B.firmas=B.firmas||{};
  const n=$('fn_'+quien);
  B.firmas[quien]={ nombre:n?n.value.trim():'', img:o.toDataURL('image/png'), ratio:3, cuando:new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}) };
  $('ef_'+quien).textContent=''; guardar();
}
function borrarFirma(quien){
  if(B.firmas&&B.firmas[quien]) B.firmas[quien].img='';
  const p=PADS[quien]; if(p){ const x=p.c.getContext('2d'); x.save(); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,p.c.width,p.c.height); x.restore(); }
  $('ph_'+quien).hidden=false; guardar();
}
function errorFirma(quien){
  const f=(B.firmas||{})[quien]||{}, n=$('fn_'+quien);
  const nom=(n?n.value:f.nombre||'').trim();
  if(!nom||nom.split(/\s+/).length<2) return 'Escribe el nombre completo (nombre y apellido).';
  if(!f.img) return 'Falta dibujar la firma.';
  return '';
}

function htmlFinal(){
  const d=B.d;
  const fila=(l,v)=>`<dt>${l}</dt><dd>${esc(v||'—')}</dd>`;
  return `<section class="card">
    <h2><span class="num ic">✅</span>Revisa y envía</h2>
    <dl class="resumen">
      ${fila('Puesto', d.nombrePuesto)}${fila('Vacantes', d.numVacantes)}${fila('Área', d.solArea)}
      ${fila('Motivo', d.motivo)}${fila('Ingreso', fechaCorta(d.fechaIngreso))}${fila('Sueldo neto', fmtMoney(d.sueldo))}
    </dl>
    <label class="consent" style="margin-top:14px"><input type="checkbox" id="acepto" ${B.acepto?'checked':''}>
      <span>Confirmo que la información es correcta y que la requisición cuenta con el visto bueno del director(a) del área. <b class="req">*</b></span></label>
    <p class="ferr" id="errAcepto"></p>
    <input type="text" id="hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" value="">
  </section>`;
}

function render(){
  progreso();
  const nav=$('navbar');
  if(paso===0){ nav.hidden=true; bienvenida(); window.scrollTo(0,0); return; }
  if(paso>ULT){ nav.hidden=true; return; }
  let h = CARDS.filter(c=>c.paso===paso).map(c=>htmlCard(c,B.d)).join('');
  if(paso===1) h = `<p class="fecha-sol">Fecha de solicitud: <b>${fechaFormato(hoyISO())}</b></p>` + h;
  if(paso===ULT) h += htmlFirmas() + htmlFinal();
  Object.keys(PADS).forEach(k=>delete PADS[k]);
  main.innerHTML = h;
  if(paso===ULT){ montarPad('sol'); if(B.dirAhora==='Sí, firma ahora') montarPad('dir'); }
  nav.hidden=false;
  $('nav').innerHTML = `<button class="btn btn-ghost" onclick="ir(${paso-1})">‹ Atrás</button>` +
    (paso<ULT ? `<button class="btn btn-primary" style="flex:1.6" onclick="siguiente()">Siguiente ›</button>`
              : `<button class="btn btn-send" style="flex:1.6" id="sendBtn" onclick="enviar()">Enviar a RH</button>`);
  window.scrollTo(0,0);
}
function ir(p){
  paso=Math.max(0,Math.min(ULT,p));
  if(paso>=1){ B.paso=paso; guardarBorrador(B); }
  render();
}
function reiniciar(){
  if(!confirm('¿Borrar lo que llevas y empezar una requisición nueva?')) return;
  borrarBorrador(); B=nueva(); ir(0);
}

/* ---------- validación visible ---------- */
function marcarErrores(lista){
  main.querySelectorAll('.field.bad').forEach(f=>{ f.classList.remove('bad'); const e=f.querySelector('.ferr'); if(e) e.textContent=''; });
  lista.forEach(({c,m})=>{
    const f=main.querySelector('[data-k="'+c.k+'"]'); if(!f) return;
    f.classList.add('bad'); const e=f.querySelector('.ferr'); if(e) e.textContent=m;
  });
  if(lista.length){
    const f=main.querySelector('[data-k="'+lista[0].c.k+'"]');
    if(f){ f.scrollIntoView({behavior:'smooth',block:'center'});
      const i=f.querySelector('input,select,textarea'); if(i) setTimeout(()=>i.focus({preventScroll:true}),350); }
  }
}
function siguiente(){
  const errs=erroresPaso(paso,B.d);
  if(errs.length){ marcarErrores(errs); return; }
  ir(paso+1);
}
function limpiarError(k){
  const f=main.querySelector('[data-k="'+k+'"]');
  if(f && f.classList.contains('bad')){ f.classList.remove('bad'); const e=f.querySelector('.ferr'); if(e) e.textContent=''; }
}

/* ---------- captura ---------- */
let tG=null;
function guardar(){ clearTimeout(tG); tG=setTimeout(()=>guardarBorrador(B),300); }
function condiciones(){
  main.querySelectorAll('[data-card]').forEach(el=>{
    const card=CARDS.find(c=>c.id===el.dataset.card); if(card) el.hidden=!cardVisible(card,B.d);
  });
  main.querySelectorAll('[data-k]').forEach(el=>{
    const c=CAMPO[el.dataset.k]; if(!c) return;
    el.hidden=!visible(c,B.d);
  });
}
main.addEventListener('input',ev=>{
  const t=ev.target, f=t.dataset&&t.dataset.f;
  if(t.id==='hp'){ B.hp=t.value; return; }
  if(t.dataset&&t.dataset.firma){ const q=t.dataset.firma; B.firmas=B.firmas||{}; B.firmas[q]=Object.assign(B.firmas[q]||{},{ nombre:t.value }); $('ef_'+q).textContent=''; guardar(); return; }
  if(!f) return;
  B.d[f]=t.value;
  limpiarError(f); condiciones(); guardar();
});
main.addEventListener('change',ev=>{
  const t=ev.target;
  if((t.tagName==='SELECT' || t.type==='date') && t.dataset.f){ B.d[t.dataset.f]=t.value; limpiarError(t.dataset.f); condiciones(); guardar(); }
  if(t.id==='acepto'){ B.acepto=t.checked; $('errAcepto').textContent=''; guardar(); }
});
main.addEventListener('focusout',ev=>{   // valida formato al salir de la casilla
  const f=ev.target.dataset&&ev.target.dataset.f; if(!f) return;
  const c=CAMPO[f]; if(!c||vacio(B.d[f])) return;
  const m=errorCampo(c,B.d); if(!m) return;
  const el=main.querySelector('[data-k="'+f+'"]'); if(!el) return;
  el.classList.add('bad'); const e=el.querySelector('.ferr'); if(e) e.textContent=m;
});
main.addEventListener('click',ev=>{
  const bd=ev.target.closest('button[data-dir]');
  if(bd){ B.dirAhora=bd.dataset.dir; bd.parentElement.querySelectorAll('button').forEach(x=>{ const s=x===bd; x.classList.toggle('sel',s); x.setAttribute('aria-checked',s); });
    $('ef_dirAhora').textContent='';
    const ahora=B.dirAhora==='Sí, firma ahora'; $('padDir').hidden=!ahora;
    if(ahora && (!PADS.dir || PADS.dir.w===0)) montarPad('dir');
    if(!ahora && B.firmas) delete B.firmas.dir;
    guardar(); return; }
  const b=ev.target.closest('button[data-f]'); if(!b) return;
  const f=b.dataset.f, v=b.dataset.v;
  if(b.dataset.multi){                       // varias opciones
    const a=Array.isArray(B.d[f])?B.d[f].slice():[];
    const i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v);
    B.d[f]=CAMPO[f].op.filter(o=>a.indexOf(o)>=0);
    const s=i<0; b.classList.toggle('sel',s); b.setAttribute('aria-checked',s);
  } else {
    B.d[f]=v;
    b.parentElement.querySelectorAll('button').forEach(x=>{ const s=x.dataset.v===v; x.classList.toggle('sel',s); x.setAttribute('aria-checked',s); });
  }
  limpiarError(f); condiciones(); guardar();
});

/* ---------- envío ---------- */
function ov(t,m,estado){
  const box=$('sendBox'); box.classList.toggle('done',!!estado);
  const ic=$('checkIc'); ic.textContent=estado==='err'?'⚠️':'✓'; ic.style.color=estado==='err'?'#c62828':'#1f9d55';
  $('sendTitle').textContent=t; $('sendMsg').textContent=m;
  $('sendClose').style.display = estado==='err' ? 'flex' : 'none';
  $('sendOv').classList.add('on');
}
function ocultarOv(){ $('sendOv').classList.remove('on'); }

async function enviar(){
  for(let p=1;p<=ULT;p++){
    const errs=erroresPaso(p,B.d);
    if(errs.length){
      if(p!==paso) ir(p);
      setTimeout(()=>marcarErrores(errs),50);
      if(p!==paso) alert('Falta información en el paso '+p+' ('+PASOS[p-1].nom+'). Te llevamos ahí.');
      return;
    }
  }
  const ef=[];
  const es=errorFirma('sol'); if(es){ $('ef_sol').textContent=es; ef.push('ef_sol'); }
  if(!B.dirAhora){ $('ef_dirAhora').textContent='Elige una opción.'; ef.push('ef_dirAhora'); }
  else if(B.dirAhora==='Sí, firma ahora'){ const ed=errorFirma('dir'); if(ed){ $('ef_dir').textContent=ed; ef.push('ef_dir'); } }
  if(ef.length){ $(ef[0]).closest('.firma,.field').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  ['sol','dir'].forEach(q=>{ const n=$('fn_'+q); if(n&&B.firmas&&B.firmas[q]) B.firmas[q].nombre=n.value.trim(); });
  if(!B.acepto){ $('errAcepto').textContent='Marca la confirmación para poder enviar.';
    $('acepto').closest('.card').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(!online()){ alert('No tienes conexión a internet. Lo que capturaste sigue guardado; intenta de nuevo cuando tengas señal.'); return; }
  if(!CONFIGURADO){ alert('El formulario aún no está conectado (falta la URL del Apps Script en app.js).'); return; }
  const btn=$('sendBtn'); btn.disabled=true;
  try{
    docFinal = await enviarRequisicion(B,ov);
    recordarSolicitante(B.d);
    B.enviado=true; guardarBorrador(B);
    ocultarOv(); gracias();
    borrarBorrador();
  }catch(err){
    btn.disabled=false;
    ov('No se pudo enviar', 'Lo que capturaste sigue guardado. Revisa tu conexión e inténtalo de nuevo.' + (err&&err.message?' ('+err.message+')':''), 'err');
  }
}
function gracias(){
  paso=ULT+1; progreso(); $('navbar').hidden=true;
  main.innerHTML=`<section class="card hero">
    <div class="ok-ic">✓</div>
    <h2 class="hero-t">Requisición enviada</h2>
    <div class="folio-prev" style="font-size:18px">Folio: ${esc(B.folio)}</div>
    <p class="hero-p"><b>${esc(B.d.nombrePuesto)}</b> · ${esc(B.d.numVacantes)} vacante${Number(B.d.numVacantes)===1?'':'s'}</p>
    <p class="hero-p">Recursos Humanos ya la recibió.${B.d.solCorreo?' Te enviamos una copia a <b>'+esc(B.d.solCorreo)+'</b>':''}${B.d.director?' y otra a <b>'+esc(B.d.director)+'</b> para su autorización':''}. Usa el folio para dar seguimiento.</p>
    <button class="btn btn-ghost btn-block" onclick="docFinal&&docFinal.save(nombrePDF(B))">📄 Descargar PDF</button>
    <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="B=nueva();ir(1)">＋ Hacer otra requisición</button>
  </section>`;
  window.scrollTo(0,0);
}

let tR=null;
window.addEventListener('resize',()=>{ clearTimeout(tR); tR=setTimeout(()=>{ if(paso===ULT){ Object.keys(PADS).forEach(q=>{ if(!$('pad_'+q)||$('pad_'+q).closest('[hidden]')) return; montarPad(q); }); } },250); });
if(LOGO) $('brandLogo').innerHTML='<img src="'+LOGO+'" alt="MD">';
window.addEventListener('pagehide',()=>{ if(!B.enviado) guardarBorrador(B); });
render();
</script>
</body>
</html>
